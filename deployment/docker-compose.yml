version: "3.9"
services:
  api:
    build: ..
    image: quant-trading-1:latest
    ports: ["8000:8000"]
    environment:
      - QT_ENV=research
    depends_on: [postgres, redis, mlflow]

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=quant
      - POSTGRES_USER=quant
      - POSTGRES_DB=quant
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow:/mlflow"]

volumes:
  pgdata:
  mlflow:
